<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS - PopUp Modal</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>
    
    <a href="#popup" class="outside">Open PopUp</a>

    <div id="popup" class="popup">

        <div class="popup-info">
            <h2>PopUp</h2>
            <p>
                This is a PopUp Box. When you click the link this box will popup out of nowhere.<br>
                When you click close button the Popup box will close (or) Hide.
            </p>
            <a href="#" class="inside">Close</a>
        </div>

    </div>

</body>

</html>
