<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    
    <!-- Font Awesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <main class="contact-wrapper">
        <div class="contact-card">
            
            <!-- LEFT PANEL: Contact Details -->
            <section class="info-side">
                <div class="info-header">
                    <h2>Get in Touch</h2>
                    <p>Have a question or want to work together? Drop us a message!</p>
                </div>

                <div class="info-list">
                    <div class="info-item">
                        <i class="fa-solid fa-location-dot info-icon"></i>
                        <div>
                            <h4>Our Office</h4>
                            <p>Bengaluru, Karnataka, India</p>
                        </div>
                    </div>

                    <div class="info-item">
                        <i class="fa-solid fa-envelope info-icon"></i>
                        <div>
                            <h4>Email Us</h4>
                            <p>contact@saikumarreddy.com</p>
                        </div>
                    </div>

                    <div class="info-item">
                        <i class="fa-solid fa-phone info-icon"></i>
                        <div>
                            <h4>Call Us</h4>
                            <p>+91 98765 43210</p>
                        </div>
                    </div>
                </div>

                <!-- Social Media Links -->
                <div class="social-links">
                    <a href="#" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
                    <a href="#" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
                    <a href="#" aria-label="X/Twitter"><i class="fa-brands fa-x-twitter"></i></a>
                </div>
            </section>

            <!-- RIGHT PANEL: HTML Form -->
            <section class="form-side">
                <form action="#" method="POST" class="contact-form">
                    
                    <div class="form-row">
                        <div class="input-group">
                            <label for="fullname">Full Name</label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-user input-icon"></i>
                                <input type="text" id="fullname" name="fullname" placeholder="Akki Sai Kumar Reddy" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="email">Email Address</label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-envelope input-icon"></i>
                                <input type="email" id="email" name="email" placeholder="name@domain.com" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="input-group">
                            <label for="phone">Phone Number</label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-phone input-icon"></i>
                                <input type="tel" id="phone" name="phone" placeholder="+91 9876543210">
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="subject">Subject</label>
                            <div class="input-wrapper select-wrapper">
                                <i class="fa-solid fa-list input-icon"></i>
                                <select id="subject" name="subject" required>
                                    <option value="" disabled selected>Select an option</option>
                                    <option value="general">General Inquiry</option>
                                    <option value="project">New Project Proposal</option>
                                    <option value="support">Technical Support</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="message">Your Message</label>
                        <div class="input-wrapper textarea-wrapper">
                            <i class="fa-solid fa-message input-icon"></i>
                            <textarea id="message" name="message" rows="4" placeholder="Write your message here..." required></textarea>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">
                        <span>Send Message</span>
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>

                </form>
            </section>

        </div>
    </main>

</body>
</html>
